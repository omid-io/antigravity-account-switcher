<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Main User Avatar Circle -->
  <circle cx="50" cy="38" r="16" fill="url(#accentGrad)"/>
  <path d="M26 78 C26 62, 38 58, 50 58 C62 58, 74 62, 74 78" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Secondary Orbiting User Nodes -->
  <circle cx="78" cy="32" r="8" fill="url(#glowGrad)"/>
  <circle cx="22" cy="32" r="8" fill="#8b5cf6"/>
  
  <!-- Dynamic Sync Arrows -->
  <path d="M68 62 L82 72 L76 74" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 62 L18 72 L24 74" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
